<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro exitoso · VSGAME</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="registro-exitoso.css">
</head>
<body>
    <main class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                <div class="card bg-dark border border-danger registro-card p-4 p-md-5 text-center">
                    <div class="card-body d-flex flex-column align-items-center gap-3">
                        <div class="icono" aria-hidden="true">
                            <svg viewBox="0 0 80 80" width="44" height="44" fill="none">
                                <polyline points="25 42 35 52 56 29" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

                        <h2 class="text-danger fw-bold text-uppercase registro-titulo">¡Registro exitoso!</h2>

                        <a href="login.html" class="btn btn-danger btn-lg w-100 fw-bold text-uppercase mt-2 boton-neon">Ir a iniciar sesión</a>

                </div>
            </div>
