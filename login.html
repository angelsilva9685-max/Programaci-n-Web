<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inciar sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="login-form" action="/login" method="POST">
        <h2>Iniciar sesión</h2>
        <h4>ZONA DE SUPERVIVENCIA</h4>
        
        <!-- Contenedor para mensajes de error -->
        <div id="error-msg" role="alert" style="display: none; color: #ff4655; text-align: center; font-size: 1rem; border: 1px solid #ff4655; border-radius: 4px; padding: 10px; background: rgba(255, 70, 85, 0.08); box-shadow: 0 0 10px rgba(255, 70, 85, 0.35);"></div>

        <label for="username">Usuario:</label>
        <input type="text" id="username" name="usuario" required><br>
        
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="contraseña" required><br>
        
        <button type="submit">Aqui inicia la guerra</button>
        <p>¿No tienes una cuenta? <a href="registro.html" class="register-link">Regístrate aquí</a></p>
    </form>
    <script>
        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');

        function mostrarError(texto) {
            errorMsg.textContent = texto;
            errorMsg.style.display = 'block';
        }

        form.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            errorMsg.style.display = 'none';

            try {
                const respuesta = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(new FormData(form))
                });

                // El servidor responde 302 -> /torneos.html cuando las credenciales son correctas
                if (respuesta.redirected) {
                    window.location.href = respuesta.url;
                    return;
                }
                // Si la contraseña o el usuario son incorrectos, el servidor responde 200 con una página de error: la descartamos y mostramos el aviso integrado
                mostrarError('Usuario o contraseña incorrectos. Intenta de nuevo.');
            } catch (error) {
                mostrarError('No se pudo conectar con el servidor. Intenta de nuevo.');
            }
        });
    </script>
</body>
</html>
