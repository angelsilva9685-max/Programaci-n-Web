<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="/nuevo-registro" method="POST">
        <h2>Crear cuenta</h2>
        <label for="username">Nuevo Usuario:</label>
        <input type="text" id="username" name="usuario" required><br>
        <label for="password">Nueva Contraseña:</label>
        <input type="password" id="password" name="contraseña" required><br>
        <button type="submit">Registrate si puedes</button>
    </form>
</body>
</html>
