<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZ3qJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container-fluid px-3 px-sm-4">
        <div class="row justify-content-center align-items-center min-vh-100 py-4">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <form class="w-100 mx-auto" action="/nuevo-registro" method="POST">
                    <h2>Crear cuenta</h2>
                    <label for="username">Nuevo Usuario:</label>
                    <input type="text" id="username" name="usuario" required><br>
                    <label for="password">Nueva Contraseña:</label>
                    <input type="password" id="password" name="contraseña" required><br>
                    <button type="submit">Registrate si puedes</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
